<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="style.css"></head>
<body><main class="auth-wrap"><div class="form-card"><a class="logo" href="index.html">🏨 GrandStay</a><h1>Create Account</h1><form id="registerForm">
<label>Full Name<input id="name" required></label>
<label>Email<input id="email" type="email" required></label>
<label>Phone<input id="phone" inputmode="numeric" maxlength="10" pattern="\d{10}" required></label>
<label>Password<input id="password" type="password" required></label>
<label>Confirm Password<input id="confirmPassword" type="password" required></label>
<button class="btn full">Register</button><p id="formMsg" class="msg"></p></form><p>Already registered? <a href="login.html">Login</a></p></div></main><script src="script.js"></script></body></html>
