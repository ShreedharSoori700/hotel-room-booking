<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .amenities-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin: 15px 0; }
    .amenity-category { border: 1px solid #ddd; padding: 15px; border-radius: 8px; }
    .amenity-category h4 { margin: 0 0 10px 0; }
    .amenity-checkbox { display: flex; gap: 8px; margin: 8px 0; }
    .amenity-checkbox input { margin-top: 3px; }
    .custom-amenity { display: flex; gap: 5px; }
    .custom-amenity input { flex: 1; font-size: 12px; }
    .custom-amenity button { padding: 5px 10px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="logo" href="index.html">🏨 GrandStay Admin</a>
      <div class="navlinks">
        <a href="#rooms">Rooms</a>
        <a href="#users">Users</a>
        <a href="#bookings">Bookings</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </nav>
  </header>

  <main class="section">
    <div class="dashboard-head">
      <div>
        <p class="eyebrow">ADMIN PANEL</p>
        <h1>Dashboard</h1>
      </div>
      <button class="btn" onclick="showRoomForm()">+ Add Room</button>
    </div>

    <div id="stats" class="stats"></div>

    <div id="roomFormWrap" class="form-card hidden">
      <h2 id="roomFormTitle">Add Room</h2>
      <form id="roomForm">
        <input type="hidden" id="roomId">
        
        <div class="two">
          <label>Room Number
            <input id="roomNumber" required>
          </label>
          <label>Room Type
            <select id="roomType">
              <option>Standard</option>
              <option>Deluxe</option>
              <option>Executive</option>
              <option>Suite</option>
            </select>
          </label>
        </div>

        <div class="two">
          <label>Price/Night
            <input id="roomPrice" type="number" min="1" required>
          </label>
          <label>Capacity
            <input id="roomCapacity" type="number" min="1" max="20" required>
          </label>
        </div>

        <label>Bed Info
          <input id="roomBedInfo" placeholder="e.g., 1 King Bed, 2 Twin Beds">
        </label>

        <label>Description
          <textarea id="roomDescription" placeholder="Room description" style="min-height: 80px;"></textarea>
        </label>

        <label>Facilities (comma separated)
          <input id="roomFacilities">
        </label>

        <label>Image URL
          <input id="roomImage">
        </label>

        <label>Status
          <select id="roomStatus">
            <option>Available</option>
            <option>Maintenance</option>
          </select>
        </label>

        <h3>Room Amenities</h3>
        <div class="amenities-grid">
          <div class="amenity-category">
            <h4>🌐 Connectivity</h4>
            <div class="amenity-checkbox">
              <input type="checkbox" id="amenity-wifi" value="Free Wi-Fi">
              <label for="amenity-wifi">Free Wi-Fi</label>
            </div>
            <div class="amenity-checkbox">
              <input type="checkbox" id="amenity-cable" value="Cable TV">
              <label for="amenity-cable">Cable TV</label>
            </div>
            <div class="custom-amenity">
              <input type="text" id="custom-connectivity" placeholder="Add custom...">
              <button type="button" onclick="addCustomAmenity('connectivity')">Add</button>
            </div>
            <div id="connectivity-list"></div>
          </div>

          <div class="amenity-category">
            <h4>🎬 Entertainment</h4>
            <div class="amenity-checkbox">
              <input type="checkbox" id="amenity-tv" value="Smart TV">
              <label for="amenity-tv">Smart TV</label>
            </div>
            <div class="amenity-checkbox">
              <input type="checkbox" id="amenity-streaming" value="Streaming Services">
              <label for="amenity-streaming">Streaming Services</label>
            </div>
            <div class="custom-amenity">
              <input type="text" id="custom-entertainment" placeholder="Add custom...">
              <button type="button" onclick="addCustomAmenity('entertainment')">Add</button>
            </div>
            <div id="entertainment-list"></div>
          </div>

          <div class="amenity-category">
            <h4>🛏️ Comfort</h4>
            <div class="amenity-checkbox">
              <input type="checkbox" id="amenity-ac" value="Air Conditioning">
              <label for="amenity-ac">Air Conditioning</label>
            </div>
            <div class="amenity-checkbox">
              <input type="checkbox" id="amenity-heating" value="Heating">
              <label for="amenity-heating">Heating</label>
            </div>
            <div class="amenity-checkbox">
              <input type="checkbox" id="amenity-mini-bar" value="Mini Bar">
              <label for="amenity-mini-bar">Mini Bar</label>
            </div>
            <div class="custom-amenity">
              <input type="text" id="custom-comfort" placeholder="Add custom...">
              <button type="button" onclick="addCustomAmenity('comfort')">Add</button>
            </div>
            <div id="comfort-list"></div>
          </div>

          <div class="amenity-category">
            <h4>🚿 Bathroom</h4>
            <div class="amenity-checkbox">
              <input type="checkbox" id="amenity-shower" value="Rain Shower">
              <label for="amenity-shower">Rain Shower</label>
            </div>
            <div class="amenity-checkbox">
              <input type="checkbox" id="amenity-bathrobe" value="Bathrobe & Slippers">
              <label for="amenity-bathrobe">Bathrobe & Slippers</label>
            </div>
            <div class="amenity-checkbox">
              <input type="checkbox" id="amenity-toiletries" value="Premium Toiletries">
              <label for="amenity-toiletries">Premium Toiletries</label>
            </div>
            <div class="custom-amenity">
              <input type="text" id="custom-bathroom" placeholder="Add custom...">
              <button type="button" onclick="addCustomAmenity('bathroom')">Add</button>
            </div>
            <div id="bathroom-list"></div>
          </div>

          <div class="amenity-category">
            <h4>🍽️ Kitchen</h4>
            <div class="amenity-checkbox">
              <input type="checkbox" id="amenity-coffee" value="Coffee Maker">
              <label for="amenity-coffee">Coffee Maker</label>
            </div>
            <div class="amenity-checkbox">
              <input type="checkbox" id="amenity-microwave" value="Microwave">
              <label for="amenity-microwave">Microwave</label>
            </div>
            <div class="amenity-checkbox">
              <input type="checkbox" id="amenity-kitchenette" value="Kitchenette">
              <label for="amenity-kitchenette">Kitchenette</label>
            </div>
            <div class="custom-amenity">
              <input type="text" id="custom-kitchen" placeholder="Add custom...">
              <button type="button" onclick="addCustomAmenity('kitchen')">Add</button>
            </div>
            <div id="kitchen-list"></div>
          </div>

          <div class="amenity-category">
            <h4>🔒 Safety</h4>
            <div class="amenity-checkbox">
              <input type="checkbox" id="amenity-safe" value="Safe">
              <label for="amenity-safe">Safe</label>
            </div>
            <div class="amenity-checkbox">
              <input type="checkbox" id="amenity-keycard" value="Key Card Access">
              <label for="amenity-keycard">Key Card Access</label>
            </div>
            <div class="custom-amenity">
              <input type="text" id="custom-safety" placeholder="Add custom...">
              <button type="button" onclick="addCustomAmenity('safety')">Add</button>
            </div>
            <div id="safety-list"></div>
          </div>
        </div>

        <button class="btn">Save Room</button>
        <button type="button" class="btn secondary" onclick="hideRoomForm()">Cancel</button>
        <p id="roomMsg" class="msg"></p>
      </form>
    </div>

    <section id="rooms">
      <h2>Rooms</h2>
      <div id="adminRooms" class="table-wrap"></div>
    </section>

    <section id="users">
      <h2>Users</h2>
      <div id="adminUsers" class="table-wrap"></div>
    </section>

    <section id="bookings">
      <h2>Bookings</h2>
      <div id="adminBookings" class="table-wrap"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
